name: Test App and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  test-app:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-26.04]
        python-version: ['3.15']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Test Functions
        run: |
          pytest -v

  deploy-app:
    needs:
      - test-app
    if: success()
    runs-on: ubuntu-22.04
    steps:
      - name: Execute SSH Deployment on EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            if [ ! -d "gh-actions-learn-1" ]; then
              git clone https://github.com/${{github.repository}}.git gh-actions-learn-1
            fi

            cd gh-actions-learn-1
            git pull origin main

            docker compose up -d --build

            docker image prune -f