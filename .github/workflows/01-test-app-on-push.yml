name: Test App and Deploy

on:
  push:
    branches:
      - main

jobs:

  setup-server:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            #!/bin/bash

            # Exit immediately if a command exits with a non-zero status
            set -e

            if command -v docker &> /dev/null; then
                echo "Docker is already installed. Skipping setup."
                exit 0
            fi

            echo "Cleaning up conflicting legacy packages..."
            for pkg in docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc; do 
                sudo apt-get remove -y $pkg || true
            done

            echo "Installing prerequisites..."
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl

            echo "Adding Docker's official GPG key..."
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc

            echo "Adding Docker repository for Ubuntu 26.04..."
            # The os-release dynamically pulls the 26.04 codename to ensure apt fetches the correct release channel
            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

            echo "Installing Docker Engine and Docker Compose v2..."
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

            echo "Enabling and starting Docker daemon..."
            sudo systemctl enable --now docker

            echo "Configuring non-root user access..."
            sudo usermod -aG docker $USER

            echo "=================================================="
            echo "Installation successful."
            echo "CRITICAL: You must apply the new group permissions."
            echo "Run: newgrp docker"
            echo "=================================================="



  test-app:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Test Functions
        run: |
          pytest -v

  deploy-app:
    needs:
      - test-app
      - setup-server
    if: success()
    runs-on: ubuntu-22.04
    steps:
      - name: Execute SSH Deployment on EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            if [ ! -d "gh-actions-learn-1" ]; then
              git clone https://github.com/atrithakar/gh-actions-learn-1.git
            fi

            cd gh-actions-learn-1
            git pull origin main

            docker compose up -d --build

            docker image prune -f